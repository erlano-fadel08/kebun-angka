<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kebun Angka — Petualangan Berhitung</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@600;700;800;900&display=swap');

:root{
  --sky: #EAF6FF;
  --sky-deep: #CFEBFF;
  --grass: #58B368;
  --grass-deep: #3E8E52;
  --leaf: #2E5339;
  --sun: #FFB627;
  --sun-deep: #F09819;
  --berry: #FF6B6B;
  --berry-deep: #E24E4E;
  --bloom: #7ED957;
  --ink: #2B3A3A;
  --paper: #FFFFFF;
  --paper-soft: #FFFDF8;
}

*{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body{
  margin:0;
  min-height:100vh;
  font-family:'Nunito', sans-serif;
  color: var(--ink);
  background:
    radial-gradient(circle at 15% 10%, rgba(255,255,255,0.6), transparent 40%),
    linear-gradient(180deg, var(--sky) 0%, var(--sky-deep) 55%, #DCF4E2 100%);
  overflow-x:hidden;
  display:flex;
  justify-content:center;
}

.stage{
  width:100%;
  max-width:640px;
  min-height:100vh;
  position:relative;
  padding: 20px 18px 40px;
  display:flex;
  flex-direction:column;
  align-items:stretch;
}

/* Decorative clouds & hills */
.cloud{
  position:absolute;
  background:#fff;
  border-radius:50px;
  opacity:0.85;
  filter: blur(0.2px);
}
.cloud:before, .cloud:after{
  content:"";
  position:absolute;
  background:#fff;
  border-radius:50%;
}
.c1{ width:70px; height:26px; top:30px; left:10%; }
.c1:before{ width:36px; height:36px; top:-16px; left:8px; }
.c1:after{ width:26px; height:26px; top:-10px; left:38px; }
.c2{ width:50px; height:20px; top:90px; right:8%; }
.c2:before{ width:26px; height:26px; top:-12px; left:6px; }
.c2:after{ width:20px; height:20px; top:-8px; left:26px; }
.hillwrap{
  position:fixed; bottom:0; left:0; width:100%; height:120px;
  z-index:0; pointer-events:none;
}
.hill{
  position:absolute; bottom:-30px; width:70%; height:150px; border-radius:50%;
  background: var(--grass);
  opacity:0.55;
}
.hill.h2{ background:var(--grass-deep); opacity:0.4; left:35%; width:80%; height:170px; bottom:-50px;}

/* ===== Card shell ===== */
.card{
  background: var(--paper);
  border-radius: 28px;
  box-shadow: 0 14px 0 rgba(46,83,57,0.12), 0 20px 40px rgba(46,83,57,0.15);
  padding: 28px 24px;
  position:relative;
  z-index:1;
}

/* ===== Headings ===== */
h1, h2, h3{
  font-family:'Baloo 2', cursive;
  margin:0;
}

/* ===== SCREENS ===== */
.screen{ display:none; flex-direction:column; gap:18px; }
.screen.active{ display:flex; }

/* --- START SCREEN --- */
#start-screen .card{
  text-align:center;
  padding-top: 10px;
  overflow:visible;
}

.mascot{
  width:150px; height:150px;
  margin: -55px auto 6px;
  position:relative;
  animation: floaty 3.2s ease-in-out infinite;
}
@keyframes floaty{
  0%,100%{ transform: translateY(0) rotate(-2deg); }
  50%{ transform: translateY(-10px) rotate(2deg); }
}

.title-block{ margin-top: 4px; }
.title-block .eyebrow{
  display:inline-block;
  font-family:'Baloo 2', cursive;
  font-weight:700;
  font-size: 0.85rem;
  letter-spacing: 0.08em;
  color: var(--grass-deep);
  background: #E7F7EA;
  padding: 5px 14px;
  border-radius: 999px;
  margin-bottom: 8px;
}
.title-block h1{
  font-size: 2.15rem;
  color: var(--leaf);
  line-height:1.1;
}
.title-block h1 span{ color: var(--sun-deep); }
.title-block p{
  font-size: 1.02rem;
  color: #5B6E64;
  font-weight:700;
  margin-top:8px;
}

.section-label{
  font-family:'Baloo 2', cursive;
  font-weight:700;
  font-size: 1.05rem;
  color: var(--leaf);
  text-align:left;
  margin: 6px 2px 0;
  display:flex;
  align-items:center;
  gap:8px;
}

.option-grid{
  display:grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.option-btn{
  border: 3px solid #E3EFE6;
  background: var(--paper-soft);
  border-radius: 18px;
  padding: 14px 8px;
  font-family:'Baloo 2', cursive;
  font-weight:700;
  font-size: 1.02rem;
  color: var(--ink);
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  transition: transform .12s ease, border-color .12s ease, background .12s ease;
}
.option-btn .emo{ font-size:1.6rem; }
.option-btn:hover{ transform: translateY(-2px); }
.option-btn.selected{
  border-color: var(--grass);
  background: #EAF9EC;
  color: var(--grass-deep);
}
.option-btn.selected .emo{ transform: scale(1.1); }

.diff-row{ display:flex; gap:10px; }
.diff-row .option-btn{ flex:1; padding: 12px 6px; font-size:0.95rem; }

.big-btn{
  margin-top: 6px;
  border:none;
  cursor:pointer;
  font-family:'Baloo 2', cursive;
  font-weight:800;
  font-size: 1.25rem;
  color:#fff;
  background: linear-gradient(180deg, var(--sun) 0%, var(--sun-deep) 100%);
  padding: 16px 22px;
  border-radius: 999px;
  box-shadow: 0 6px 0 #C97A0E, 0 10px 18px rgba(240,152,25,0.35);
  transition: transform .08s ease, box-shadow .08s ease;
}
.big-btn:active{
  transform: translateY(4px);
  box-shadow: 0 2px 0 #C97A0E, 0 4px 10px rgba(240,152,25,0.3);
}
.big-btn.green{
  background: linear-gradient(180deg, var(--bloom) 0%, var(--grass-deep) 100%);
  box-shadow: 0 6px 0 #2E6B3C, 0 10px 18px rgba(62,142,82,0.35);
}
.big-btn.green:active{ box-shadow: 0 2px 0 #2E6B3C, 0 4px 10px rgba(62,142,82,0.3); }

/* --- GAME SCREEN --- */
#game-screen .card{ padding: 22px 20px 26px; }

.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom: 14px;
}
.pill{
  font-family:'Baloo 2', cursive;
  font-weight:700;
  background:#F2F8F3;
  border-radius: 999px;
  padding: 7px 14px;
  font-size:0.95rem;
  color: var(--leaf);
  display:flex;
  align-items:center;
  gap:6px;
}
.pill.score{ background:#FFF4E0; color:#A9670B; }

/* Garden path progress */
.path-wrap{
  display:flex;
  align-items:center;
  gap:4px;
  margin: 4px 0 18px;
  padding: 10px 8px;
  background: #F3FAF4;
  border-radius: 16px;
}
.flower{
  flex:1;
  text-align:center;
  font-size: 1.25rem;
  filter: grayscale(1) opacity(0.35);
  transform: scale(0.85);
  transition: all .3s ease;
}
.flower.bloomed{
  filter: none;
  transform: scale(1.05);
}

/* Timer bar */
.timer-track{
  width:100%; height:10px;
  background:#F1EFE4;
  border-radius: 999px;
  overflow:hidden;
  margin-bottom: 18px;
}
.timer-fill{
  height:100%;
  width:100%;
  background: linear-gradient(90deg, var(--bloom), var(--sun));
  border-radius:999px;
  transition: width 1s linear;
}
.timer-fill.warn{ background: linear-gradient(90deg, var(--sun), var(--berry)); }

.question-box{
  text-align:center;
  padding: 26px 10px 30px;
  position:relative;
}
.mascot-mini{
  width:64px; height:64px;
  margin: 0 auto 6px;
}
.qtext{
  font-family:'Baloo 2', cursive;
  font-weight:800;
  font-size: 2.6rem;
  color: var(--leaf);
  letter-spacing: 1px;
}
.qtext .op{ color: var(--sun-deep); margin: 0 8px; }

.answers-grid{
  display:grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.ans-btn{
  border: none;
  border-radius: 18px;
  background: var(--paper-soft);
  border: 3px solid #E3EFE6;
  padding: 18px 10px;
  font-family:'Baloo 2', cursive;
  font-weight:800;
  font-size: 1.5rem;
  color: var(--ink);
  cursor:pointer;
  transition: transform .1s ease, border-color .15s ease, background .15s ease;
}
.ans-btn:hover{ transform: translateY(-2px); border-color: #cfe6d3; }
.ans-btn.correct{
  background: #E4F9E5;
  border-color: var(--bloom);
  color: var(--grass-deep);
  animation: pop .35s ease;
}
.ans-btn.wrong{
  background: #FFEAEA;
  border-color: var(--berry);
  color: var(--berry-deep);
  animation: shake .4s ease;
}
.ans-btn:disabled{ cursor:default; }
@keyframes pop{
  0%{ transform: scale(1); }
  40%{ transform: scale(1.08); }
  100%{ transform: scale(1); }
}
@keyframes shake{
  0%,100%{ transform: translateX(0); }
  25%{ transform: translateX(-6px); }
  75%{ transform: translateX(6px); }
}

.feedback{
  min-height: 30px;
  text-align:center;
  font-family:'Baloo 2', cursive;
  font-weight:700;
  font-size: 1.1rem;
  margin-top: 14px;
  color: var(--grass-deep);
}
.feedback.wrong{ color: var(--berry-deep); }

/* --- END SCREEN --- */
#end-screen .card{ text-align:center; }
.stars{
  font-size: 2.4rem;
  margin: 6px 0 4px;
  letter-spacing: 6px;
}
.result-score{
  font-family:'Baloo 2', cursive;
  font-weight:800;
  font-size: 3rem;
  color: var(--leaf);
  margin: 6px 0 0;
}
.result-sub{
  font-weight:800;
  color:#5B6E64;
  margin-bottom: 10px;
}
.result-msg{
  background:#FFF7E6;
  border-radius:16px;
  padding: 14px 16px;
  font-weight:700;
  color:#8A5A0B;
  margin: 6px 0 18px;
}
.end-btn-row{ display:flex; gap:10px; flex-direction:column; }

/* Focus visibility for accessibility */
button:focus-visible{
  outline: 3px solid #2E5339;
  outline-offset: 3px;
}

@media (prefers-reduced-motion: reduce){
  *{ animation: none !important; transition: none !important; }
}

@media (max-width: 380px){
  .qtext{ font-size: 2.1rem; }
  .title-block h1{ font-size: 1.7rem; }
}
</style>
</head>
<body>

<div class="hillwrap"><div class="hill"></div><div class="hill h2"></div></div>
<div class="cloud c1"></div>
<div class="cloud c2"></div>

<div class="stage">

  <!-- START SCREEN -->
  <div class="screen active" id="start-screen">
    <div class="card">
      <svg class="mascot" viewBox="0 0 200 200" id="mascotStart">
        <ellipse cx="100" cy="170" rx="55" ry="14" fill="#3E8E52" opacity="0.15"/>
        <!-- fox body -->
        <path d="M60 120 Q55 80 100 78 Q145 80 140 120 Q140 150 100 155 Q60 150 60 120 Z" fill="#FF9F5A"/>
        <!-- ears -->
        <path d="M55 70 L75 100 L45 100 Z" fill="#FF9F5A"/>
        <path d="M145 70 L155 100 L125 100 Z" fill="#FF9F5A"/>
        <path d="M58 82 L70 96 L52 96 Z" fill="#FFF3E6"/>
        <path d="M142 82 L148 96 L132 96 Z" fill="#FFF3E6"/>
        <!-- face patch -->
        <ellipse cx="100" cy="118" rx="34" ry="26" fill="#FFF3E6"/>
        <!-- eyes -->
        <circle cx="86" cy="112" r="5" fill="#2B3A3A"/>
        <circle cx="114" cy="112" r="5" fill="#2B3A3A"/>
        <circle cx="88" cy="110" r="1.6" fill="#fff"/>
        <circle cx="116" cy="110" r="1.6" fill="#fff"/>
        <!-- nose -->
        <ellipse cx="100" cy="128" rx="6" ry="4.5" fill="#2B3A3A"/>
        <!-- blush -->
        <ellipse cx="78" cy="124" rx="7" ry="4" fill="#FFB6A6" opacity="0.7"/>
        <ellipse cx="122" cy="124" rx="7" ry="4" fill="#FFB6A6" opacity="0.7"/>
        <!-- smile -->
        <path d="M92 132 Q100 138 108 132" stroke="#2B3A3A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <!-- tail -->
        <path d="M140 130 Q175 120 170 160 Q165 180 140 165 Q155 150 140 130 Z" fill="#FF9F5A"/>
        <ellipse cx="152" cy="165" rx="14" ry="9" fill="#FFF3E6"/>
      </svg>

      <div class="title-block">
        <span class="eyebrow">🌱 Ayo Berhitung!</span>
        <h1>Kebun <span>Angka</span></h1>
        <p>Bantu Si Rubah menanam bunga dengan menjawab soal!</p>
      </div>

      <div style="margin-top:22px; text-align:left; display:flex; flex-direction:column; gap:14px;">
        <div>
          <div class="section-label">🍎 Pilih Jenis Soal</div>
          <div class="option-grid" id="opGrid">
            <button class="option-btn selected" data-op="mix"><span class="emo">🎲</span>Campuran</button>
            <button class="option-btn" data-op="add"><span class="emo">➕</span>Penjumlahan</button>
            <button class="option-btn" data-op="sub"><span class="emo">➖</span>Pengurangan</button>
            <button class="option-btn" data-op="mul"><span class="emo">✖️</span>Perkalian</button>
          </div>
        </div>

        <div>
          <div class="section-label">⭐ Pilih Tingkat</div>
          <div class="diff-row" id="diffGrid">
            <button class="option-btn selected" data-diff="easy"><span class="emo">🌼</span>Mudah</button>
            <button class="option-btn" data-diff="medium"><span class="emo">🌻</span>Sedang</button>
            <button class="option-btn" data-diff="hard"><span class="emo">🌳</span>Sulit</button>
          </div>
        </div>
      </div>

      <button class="big-btn" id="startBtn" style="width:100%; margin-top:22px;">Mulai Main! 🚀</button>
    </div>
  </div>

  <!-- GAME SCREEN -->
  <div class="screen" id="game-screen">
    <div class="card">
      <div class="top-bar">
        <div class="pill">📖 Soal <span id="qNum">1</span>/10</div>
        <div class="pill score">⭐ <span id="scoreNum">0</span></div>
      </div>

      <div class="path-wrap" id="pathWrap"></div>

      <div class="timer-track"><div class="timer-fill" id="timerFill"></div></div>

      <div class="question-box">
        <svg class="mascot-mini" viewBox="0 0 200 200" id="mascotGame">
          <path d="M60 120 Q55 80 100 78 Q145 80 140 120 Q140 150 100 155 Q60 150 60 120 Z" fill="#FF9F5A"/>
          <path d="M55 70 L75 100 L45 100 Z" fill="#FF9F5A"/>
          <path d="M145 70 L155 100 L125 100 Z" fill="#FF9F5A"/>
          <ellipse cx="100" cy="118" rx="34" ry="26" fill="#FFF3E6"/>
          <circle cx="86" cy="112" r="5" fill="#2B3A3A"/>
          <circle cx="114" cy="112" r="5" fill="#2B3A3A"/>
          <ellipse cx="100" cy="128" rx="6" ry="4.5" fill="#2B3A3A"/>
          <path d="M92 132 Q100 138 108 132" stroke="#2B3A3A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        </svg>
        <div class="qtext" id="qtext">6 <span class="op">+</span> 3</div>
      </div>

      <div class="answers-grid" id="answersGrid"></div>
      <div class="feedback" id="feedback"></div>
    </div>
  </div>

  <!-- END SCREEN -->
  <div class="screen" id="end-screen">
    <div class="card">
      <div class="stars" id="stars">⭐⭐⭐</div>
      <h2 style="color:var(--leaf); font-size:1.4rem;">Kebunmu Sudah Jadi!</h2>
      <div class="result-score"><span id="finalScore">10</span>/10</div>
      <div class="result-sub">Jawaban Benar</div>
      <div class="result-msg" id="resultMsg">Hebat sekali! Kamu jago berhitung! 🎉</div>
      <div class="end-btn-row">
        <button class="big-btn green" id="playAgainBtn">Main Lagi 🔁</button>
        <button class="big-btn" id="changeModeBtn" style="background:linear-gradient(180deg,#B8C6BC,#94A79B); box-shadow:0 6px 0 #6E7F72;">Ganti Mode</button>
      </div>
    </div>
  </div>

</div>

<script>
(function(){
  const TOTAL_Q = 10;
  const TIME_PER_Q = 15; // seconds

  let selectedOp = 'mix';
  let selectedDiff = 'easy';
  let currentQ = 0;
  let score = 0;
  let timer = null;
  let timeLeft = TIME_PER_Q;
  let answered = false;
  let currentAnswer = null;

  const screens = {
    start: document.getElementById('start-screen'),
    game: document.getElementById('game-screen'),
    end: document.getElementById('end-screen'),
  };

  function showScreen(name){
    Object.values(screens).forEach(s => s.classList.remove('active'));
    screens[name].classList.add('active');
  }

  // ---- Option selection (start screen) ----
  document.getElementById('opGrid').addEventListener('click', (e)=>{
    const btn = e.target.closest('.option-btn');
    if(!btn) return;
    document.querySelectorAll('#opGrid .option-btn').forEach(b=>b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedOp = btn.dataset.op;
  });
  document.getElementById('diffGrid').addEventListener('click', (e)=>{
    const btn = e.target.closest('.option-btn');
    if(!btn) return;
    document.querySelectorAll('#diffGrid .option-btn').forEach(b=>b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedDiff = btn.dataset.diff;
  });

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('playAgainBtn').addEventListener('click', startGame);
  document.getElementById('changeModeBtn').addEventListener('click', ()=>{
    stopTimer();
    showScreen('start');
  });

  // ---- Build garden path dots ----
  function buildPath(){
    const wrap = document.getElementById('pathWrap');
    wrap.innerHTML = '';
    for(let i=0;i<TOTAL_Q;i++){
      const d = document.createElement('div');
      d.className = 'flower';
      d.textContent = '🌱';
      wrap.appendChild(d);
    }
  }
  function bloomPath(idx, correct){
    const wrap = document.getElementById('pathWrap');
    const el = wrap.children[idx];
    if(!el) return;
    el.classList.add('bloomed');
    el.textContent = correct ? '🌸' : '🥀';
  }

  // ---- Question generation ----
  function randInt(min, max){ return Math.floor(Math.random()*(max-min+1))+min; }

  function genQuestion(){
    let op = selectedOp;
    if(op === 'mix'){
      const ops = ['add','sub','mul'];
      op = ops[randInt(0,2)];
    }

    let a, b, answer, symbol;

    if(op === 'add'){
      symbol = '+';
      if(selectedDiff === 'easy'){ a = randInt(1,10); b = randInt(1,10); }
      else if(selectedDiff === 'medium'){ a = randInt(5,20); b = randInt(5,20); }
      else { a = randInt(10,50); b = randInt(10,50); }
      answer = a + b;
    } else if(op === 'sub'){
      symbol = '−';
      if(selectedDiff === 'easy'){ a = randInt(1,10); b = randInt(1, a); }
      else if(selectedDiff === 'medium'){ a = randInt(10,20); b = randInt(1, a); }
      else { a = randInt(20,50); b = randInt(1, a); }
      answer = a - b;
    } else {
      symbol = '×';
      if(selectedDiff === 'easy'){ a = randInt(1,5); b = randInt(1,5); }
      else if(selectedDiff === 'medium'){ a = randInt(2,8); b = randInt(2,8); }
      else { a = randInt(3,10); b = randInt(3,10); }
      answer = a * b;
    }

    // generate distractor choices
    const choices = new Set([answer]);
    while(choices.size < 4){
      let delta = randInt(-5,5);
      if(delta === 0) delta = randInt(1,3);
      let wrong = answer + delta;
      if(wrong < 0) wrong = answer + Math.abs(delta) + 1;
      choices.add(wrong);
    }
    const choiceArr = Array.from(choices).sort(()=>Math.random()-0.5);

    return { a, b, symbol, answer, choices: choiceArr };
  }

  let curQData = null;

  function loadQuestion(){
    answered = false;
    curQData = genQuestion();
    document.getElementById('qtext').innerHTML =
      `${curQData.a} <span class="op">${curQData.symbol}</span> ${curQData.b}`;
    document.getElementById('qNum').textContent = currentQ + 1;
    document.getElementById('feedback').textContent = '';
    document.getElementById('feedback').className = 'feedback';

    const grid = document.getElementById('answersGrid');
    grid.innerHTML = '';
    curQData.choices.forEach(choice=>{
      const btn = document.createElement('button');
      btn.className = 'ans-btn';
      btn.textContent = choice;
      btn.addEventListener('click', ()=> handleAnswer(choice, btn));
      grid.appendChild(btn);
    });

    resetTimer();
  }

  function resetTimer(){
    stopTimer();
    timeLeft = TIME_PER_Q;
    const fill = document.getElementById('timerFill');
    fill.style.transition = 'none';
    fill.style.width = '100%';
    fill.classList.remove('warn');
    void fill.offsetWidth; // reflow
    fill.style.transition = 'width 1s linear';

    timer = setInterval(()=>{
      timeLeft -= 1;
      const pct = Math.max(0, (timeLeft/TIME_PER_Q)*100);
      fill.style.width = pct + '%';
      if(timeLeft <= 5) fill.classList.add('warn');
      if(timeLeft <= 0){
        stopTimer();
        if(!answered) handleAnswer(null, null); // time's up
      }
    }, 1000);
  }
  function stopTimer(){
    if(timer){ clearInterval(timer); timer = null; }
  }

  function handleAnswer(choice, btnEl){
    if(answered) return;
    answered = true;
    stopTimer();

    const correct = choice === curQData.answer;
    const allBtns = document.querySelectorAll('#answersGrid .ans-btn');
    allBtns.forEach(b=>{
      b.disabled = true;
      if(parseInt(b.textContent) === curQData.answer){
        b.classList.add('correct');
      } else if(b === btnEl){
        b.classList.add('wrong');
      }
    });

    const fb = document.getElementById('feedback');
    if(correct){
      score++;
      document.getElementById('scoreNum').textContent = score;
      fb.textContent = pickPraise();
      fb.className = 'feedback';
    } else if(choice === null){
      fb.textContent = `Waktu habis! Jawabannya ${curQData.answer}`;
      fb.className = 'feedback wrong';
    } else {
      fb.textContent = `Belum tepat, jawabannya ${curQData.answer}`;
      fb.className = 'feedback wrong';
    }

    bloomPath(currentQ, correct);

    setTimeout(()=>{
      currentQ++;
      if(currentQ >= TOTAL_Q){
        endGame();
      } else {
        loadQuestion();
      }
    }, 1100);
  }

  function pickPraise(){
    const arr = ['Betul! Hebat! 🎉','Keren! Lanjutkan! 🌟','Pintar sekali! 👏','Tepat sekali! 😄','Mantap! 🌸'];
    return arr[randInt(0, arr.length-1)];
  }

  function startGame(){
    currentQ = 0;
    score = 0;
    document.getElementById('scoreNum').textContent = '0';
    buildPath();
    showScreen('game');
    loadQuestion();
  }

  function endGame(){
    showScreen('end');
    document.getElementById('finalScore').textContent = score;
    const pct = score / TOTAL_Q;
    let starText, msg;
    if(pct >= 0.9){ starText = '⭐⭐⭐'; msg = 'Luar biasa! Kamu juara berhitung! 🏆'; }
    else if(pct >= 0.6){ starText = '⭐⭐'; msg = 'Bagus sekali! Terus berlatih ya! 🌟'; }
    else if(pct >= 0.3){ starText = '⭐'; msg = 'Kerja bagus! Ayo coba lagi biar makin jago! 💪'; }
    else { starText = '🌱'; msg = 'Jangan menyerah! Yuk coba lagi, kamu pasti bisa! 🌈'; }
    document.getElementById('stars').textContent = starText;
    document.getElementById('resultMsg').textContent = msg;
  }

})();
</script>

</body>
</html>
